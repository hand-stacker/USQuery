services:
    django-docker:
        build: .
        container_name: django-docker
        volumes:
            - .:/app
        env_file:
            - .env.prod
    frontend-proxy:
        image: nginx:latest
        ports:
            - "8001:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro 
            - .:/app 
        depends_on:
            - django-docker
volumes:
    postgres_data: