services:
    django-docker:
        build: .
        container_name: django-docker
        volumes:
            - .:/app
        env_file:
            - .env.prod
    frontend-proxy:
        image: nginx:latest
        ports:
            - "8001:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro 
            - .:/app 
        depends_on:
            - django-docker
    # Disposable database for the pytest suite only (never the Render DB).
    # 5433 avoids the local PostgreSQL on 5432; the pgvector image also ships
    # pg_trgm, both of which the migrations require.
    test-db:
        image: pgvector/pgvector:pg17
        container_name: usquery-test-db
        # Only started when named: `docker compose up -d test-db`.
        profiles: ["test"]
        environment:
            POSTGRES_PASSWORD: test
            POSTGRES_DB: usquery_test
        ports:
            - "5433:5432"
        tmpfs:
            - /var/lib/postgresql/data
volumes:
    postgres_data: