{% extends "app/layout.html" %}
{% load static %}

{% block content %}
<div class="row align-items-md-stretch">
    <div class="col-md-6">
        <div class="g-0 row h-400 p-4 mb-4 rounded shadow-sm align-items-md-stretch glass-0">
            <h3> Search for bills</h3>
            <div class="query-container">
                {% include "BillQuery/bill-range-form.html" %}
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="g-0 row h-400 p-4 mb-4 rounded shadow-sm align-items-md-stretch glass-0">
            <h3>Search for votes</h3>
            <div class="query-container">
                {% include "BillQuery/vote-range-form.html" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'scripts/loadTomSelectForms.js' %}"></script>
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
{% endblock %}
