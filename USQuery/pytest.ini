[pytest]
DJANGO_SETTINGS_MODULE = USQuery.test_settings
pythonpath = .
testpaths = tests
python_files = test_*.py
norecursedirs = env3.11 obj .vs models static staticfiles templates migrations __pycache__
addopts = --import-mode=importlib --reuse-db -m "not external" --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: pure logic, no database (auto-applied under tests/unit/)
    integration: database and/or Django test client, externals mocked (auto-applied under tests/integration/)
    slow: heavy paths (TensorFlow, full ingest, RAG); excluded from PR CI
    external: needs a real external service; never runs by default
filterwarnings =
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:keras.*
    ignore::DeprecationWarning:gqlauth.*
