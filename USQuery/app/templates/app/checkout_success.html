{% extends "app/layout.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card-dark p-5 text-center">
            <div style="font-size: 56px; margin-bottom: 20px;">
                <i class="fa-solid fa-circle-check" style="color: #2ea87e;"></i>
            </div>
            <h2 class="mb-3">Payment Successful</h2>
            <p style="color: rgba(250,250,250,0.75); font-size: 15px; line-height: 1.6;">
                Thank you for upgrading! Your subscription is now active.
                It may take a moment for your account to reflect the new tier, 
                please refresh the page if features don't appear right away.
            </p>
            <div class="d-flex gap-3 justify-content-center mt-4 flex-wrap">
                <a href="{% url 'home' %}" class="btn-glass">
                    <i class="fa-solid fa-house"></i> Go Home
                </a>
                <a href="{% url 'manage_subscription' %}" class="btn-glass">
                    <i class="fa-solid fa-gear"></i> Manage Subscription
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
