{% extends "app/layout.html" %}
{% block content %}
<h2>Reset your password</h2>

<p>Enter your email address and we’ll send you a reset link.</p>

<form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}<br>
    {{ form.email }}
    {{ form.email.errors }}

    <button type="submit">Send reset email</button>
</form>
{% endblock %}
