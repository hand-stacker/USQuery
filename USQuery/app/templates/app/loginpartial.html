{% if user.is_authenticated %}
<form id="logoutForm" action="/logout/" method="post" class="navbar-right d-none">
    {% csrf_token %}
</form>
<ul class="nav navbar-nav navbar-right nav-item d-flex align-items-center gap-1">
    <li class="nav-item">
        <a class="nav-link" href="{% url 'manage_subscription' %}">Account</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="javascript:document.getElementById('logoutForm').submit()">Log off</a>
    </li>
</ul>

{% else %}

<ul class="nav navbar-nav navbar-right nav-item">
    <li><a class="nav-link" href="{% url 'login' %}">Log in</a></li>
</ul>

{% endif %}
