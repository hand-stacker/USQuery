name: Tests

# Hermetic: no repository secrets are used. USQuery/USQuery/test_settings.py
# stubs every credential, and the suite aborts if the database isn't the
# service container below.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, dockerized-app]
  schedule:
    - cron: "0 7 * * *"   # nightly, runs the slow suite too
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: USQuery

env:
  DJANGO_SETTINGS_MODULE: USQuery.test_settings
  TEST_DATABASE_URL: postgresql://postgres:test@localhost:5433/usquery_test
  PYTHONUNBUFFERED: "1"
  TF_CPP_MIN_LOG_LEVEL: "2"

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            USQuery/requirements.txt
            USQuery/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Path, not just -m unit: collecting tests/integration imports the views
      # and with them TensorFlow, which the unit tests never need.
      - run: pytest tests/unit -m unit -p no:cacheprovider --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report
          path: USQuery/reports/

  integration:
    name: integration
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: usquery_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            USQuery/requirements.txt
            USQuery/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Our apps only: gqlauth (strawberry-django-auth) ships without a migration
      # matching its own models, so a fresh install always reports drift there.
      - name: Migration drift check
        run: python manage.py makemigrations app BillQuery SenateQuery notifications strawberryAPI --check --dry-run
      - name: Integration tests
        run: >-
          pytest tests/integration -m "not slow" -p no:cacheprovider --create-db
          --cov=app --cov=BillQuery --cov=SenateQuery --cov=notifications --cov=strawberryAPI
          --cov-report=xml:reports/coverage.xml --cov-report=term
          --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: USQuery/reports/

  slow:
    name: slow
    needs: unit
    # Every push (it gates promotion to master) and nightly; skipped on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: usquery_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            USQuery/requirements.txt
            USQuery/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/integration -m slow -p no:cacheprovider --create-db --junitxml=reports/slow.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slow-report
          path: USQuery/reports/

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: USQuery
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Render deploys from master. A green push to dockerized-app fast-forwards
  # master to that exact commit, unless the pushed head commit's message
  # contains [no-promote]. Fast-forward only: if master has commits that
  # dockerized-app lacks, this fails rather than overwrite them -- merge master
  # into dockerized-app and push again.
  promote:
    name: promote to master
    needs: [unit, integration, slow, docker-build]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dockerized-app' &&
      !contains(github.event.head_commit.message, '[no-promote]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: promote-master
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Fast-forward master
        run: |
          git fetch origin master
          if ! git merge-base --is-ancestor origin/master "$GITHUB_SHA"; then
            echo "::error::master has commits that dockerized-app does not. Merge master into dockerized-app, then push again."
            exit 1
          fi
          git push origin "$GITHUB_SHA:refs/heads/master"
          echo "master -> $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
